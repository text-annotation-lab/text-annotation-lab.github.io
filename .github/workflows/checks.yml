name: Pull request checks

# The same checks as before a publish, run on a pull request so that a broken change is seen before it is merged.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # The test files run several at a time (scripts/run-tests.mjs). Provider traffic is mocked; no keys are used.
      - run: npm test
